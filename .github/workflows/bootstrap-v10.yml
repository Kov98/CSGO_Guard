name: bootstrap-v10-source
on:
  push:
    branches: [ v10-hardening ]
    paths:
      - 'bootstrap/READY'
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-hardening
          fetch-depth: 0
      - name: Decode and replace tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v10-preserve /tmp/v10-unpack
          if [ -d docs/superpowers ]; then cp -a docs/superpowers /tmp/v10-preserve/superpowers; fi
          cat bootstrap/CSGO_Guard_v10.tar.xz.b64.part* | base64 -d > /tmp/CSGO_Guard_v10.tar.xz
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.')
          for p in list(root.iterdir()):
              if p.name == '.git':
                  continue
              if p.is_dir():
                  shutil.rmtree(p)
              else:
                  p.unlink()
          PY
          tar -xJf /tmp/CSGO_Guard_v10.tar.xz -C .
          if [ -d /tmp/v10-preserve/superpowers ]; then
            mkdir -p docs
            rm -rf docs/superpowers
            cp -a /tmp/v10-preserve/superpowers docs/superpowers
          fi
          git config user.name "CSGO Guard Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish CSGO Guard v10 source"
          git push origin HEAD:v10-hardening
